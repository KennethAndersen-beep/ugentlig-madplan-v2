name: Price API smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/price-api-test.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test authenticated price endpoints (metadata only)
        env:
          PREJ_API_KEY: ${{ secrets.PREJ_API_KEY }}
          SHELFATLAS_API_KEY: ${{ secrets.SHELFATLAS_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          probes = [
              ("Prej stats", "PREJ_API_KEY", "https://api.prej.app/v1/stats"),
              ("Prej products", "PREJ_API_KEY", "https://api.prej.app/v1/products?q=ris"),
              ("ShelfAtlas offers", "SHELFATLAS_API_KEY", "https://api.shelfatlas.com/api/v1/public/catalog/offers?limit=10"),
              ("ShelfAtlas search", "SHELFATLAS_API_KEY", "https://api.shelfatlas.com/api/v1/public/catalog/offers/search?q=ris"),
          ]
          failed = False
          for label, key, url in probes:
              secret = os.environ.get(key)
              if not secret:
                  print(label + ": missing secret")
                  failed = True
                  continue
              try:
                  request = urllib.request.Request(url, headers={"Authorization": "Bearer " + secret, "Accept": "application/json"})
                  with opener.open(request, timeout=20) as response:
                      payload = json.loads(response.read(4_000_000))
                      if not isinstance(payload, (dict, list)):
                          raise ValueError("unexpected JSON type")
                      counts = {k:len(v) for k,v in payload.items() if isinstance(v,list) and k in ("data","products","offers","results","items")} if isinstance(payload,dict) else {"items":len(payload)}
                      print(f"{label}: HTTP {response.status}, valid JSON, list counts={counts}")
              except urllib.error.HTTPError as exc:
                  print(f"{label}: HTTP {exc.code}")
                  failed = True
              except Exception as exc:
                  print(f"{label}: {type(exc).__name__}")
                  failed = True
          raise SystemExit(int(failed))
          PY
