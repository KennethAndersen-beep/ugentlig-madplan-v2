name: Price API smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/price-api-test.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Safe API access diagnostics
        env:
          PREJ_API_KEY: ${{ secrets.PREJ_API_KEY }}
          SHELFATLAS_API_KEY: ${{ secrets.SHELFATLAS_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, re, urllib.request, urllib.error
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          probes = [
              ("Prej public index", None, "https://api.prej.app/"),
              ("Prej stats", "PREJ_API_KEY", "https://api.prej.app/v1/stats"),
              ("ShelfAtlas public stats", None, "https://api.shelfatlas.com/api/v1/public/catalog/stats"),
              ("ShelfAtlas chains", "SHELFATLAS_API_KEY", "https://api.shelfatlas.com/api/v1/public/catalog/chains"),
          ]
          def report(label, status, headers, raw):
              mime = headers.get_content_type()
              kind = "json" if mime == "application/json" or mime.endswith("+json") else ("html" if mime == "text/html" else "other")
              print(f"{label}: HTTP {status}; content={kind}; cloudflare_header={bool(headers.get('CF-Ray'))}; challenge={headers.get('cf-mitigated','').lower() == 'challenge'}")
              for name in ("ratelimit-limit","ratelimit-remaining","ratelimit-reset","x-ratelimit-limit","x-ratelimit-remaining","x-ratelimit-reset","retry-after"):
                  value = headers.get(name, "")
                  if re.fullmatch(r"[0-9]{1,12}", value):
                      print(f"  {name}={value}")
              parsed = None
              try:
                  parsed = json.loads(raw)
              except (ValueError, UnicodeError):
                  pass
              if isinstance(parsed, dict):
                  candidates = [parsed.get("code"), parsed.get("error_code"), parsed.get("error"), parsed.get("message"), parsed.get("detail")]
                  if isinstance(parsed.get("error"),dict):
                      candidates.extend(parsed["error"].get(k) for k in ("code","message"))
                  s = " ".join(v.lower() for v in candidates if isinstance(v,str))
                  rules = {"invalid_key":r"invalid.{0,20}(key|token)|unauthori[sz]ed", "missing_key":r"missing.{0,20}(key|token)", "quota":r"quota|rate.limit|too many requests", "forbidden":r"forbidden|access denied", "plan_restriction":r"subscription|plan restriction|upgrade", "ip_restriction":r"ip.{0,20}(blocked|restricted|denied)"}
                  labels = [k for k,p in rules.items() if re.search(p,s)]
                  print("  error categories=" + (",".join(labels) if labels else "none recognized"))
              elif kind == "html":
                  low = raw.lower()
                  print("  html challenge indicators=" + str(any(x in low for x in (b"cf-chl-", b"just a moment", b"cloudflare ray id"))))
              return 200 <= status < 300 and isinstance(parsed,(dict,list))
          failed = False
          for label,key,url in probes:
              headers = {"Accept":"application/json"}
              if key:
                  secret = os.environ.get(key,"")
                  if not secret:
                      print(label + ": missing secret")
                      failed = True
                      continue
                  prefixes = ("prej_dev_","prej_biz_","prej_pro_") if key == "PREJ_API_KEY" else ("sa_live_",)
                  format_ok = secret.startswith(prefixes) and not any(c.isspace() for c in secret) and any(len(secret)>len(p) for p in prefixes if secret.startswith(p))
                  print(label + ": documented key prefix and whitespace check=" + str(format_ok))
                  if not format_ok:
                      failed = True
                      continue
                  headers["Authorization"] = "Bearer " + secret
              try:
                  with opener.open(urllib.request.Request(url,headers=headers),timeout=20) as response:
                      ok = report(label,response.status,response.headers,response.read(262144))
              except urllib.error.HTTPError as exc:
                  report(label,exc.code,exc.headers,exc.read(65536))
                  ok = False
              except Exception as exc:
                  print(label + ": transport/parser error (" + type(exc).__name__ + ")")
                  ok = False
              if key and not ok:
                  failed = True
          raise SystemExit(int(failed))
          PY
